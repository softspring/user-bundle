doctrine:
    dbal:
        # Functional tests use SQLite to avoid external database services.
        driver: pdo_sqlite
        path: '%kernel.cache_dir%/test_database.sqlite'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: 'doctrine.orm.naming_strategy.underscore_number_aware'
        auto_mapping: true
        mappings:
            TestEntities:
                is_bundle: false
                type: 'attribute'
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'Softspring\UserBundle\Tests\TestApplication\Entity'
                alias: 'app'
